<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Terracotta Gradient -->
    <linearGradient id="terracottaGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#E28766" />
      <stop offset="50%" stop-color="#C87A5B" />
      <stop offset="100%" stop-color="#9C4B2E" />
    </linearGradient>

    <!-- Warm Cream Tone for Cap & Bag -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4ECE1" />
    </linearGradient>

    <!-- Warm Gold Gradient for Tassel & Handles -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4A6" />
      <stop offset="60%" stop-color="#E5B25D" />
      <stop offset="100%" stop-color="#C68F36" />
    </linearGradient>

    <!-- Deep Shadow for Tactile Depth -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#3D180B" flood-opacity="0.38" />
    </filter>

    <filter id="innerCapShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Squircle Base with 22% radius -->
  <rect width="512" height="512" rx="112" fill="url(#terracottaGrad)" />
  
  <!-- Subtle Tactile Rim Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4" />

  <!-- Main Centerpiece: Campus Mortarboard + Stash Bag Fusion -->
  <g filter="url(#softShadow)">
    
    <!-- Stash Bag Body -->
    <path d="M 164 240 L 178 394 C 180 410, 194 422, 210 422 L 302 422 C 318 422, 332 410, 334 394 L 348 240 Z" 
          fill="url(#creamGrad)" />

    <!-- Stash Bag Shadow Edge/Fold -->
    <path d="M 178 394 C 180 410, 194 422, 210 422 L 256 422 L 256 240 L 164 240 Z" 
          fill="rgba(0,0,0,0.03)" />

    <!-- Shopping Bag Gold Handle -->
    <path d="M 216 270 C 216 318, 296 318, 296 270" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="14" 
          stroke-linecap="round" />

    <!-- Handle Grommets -->
    <circle cx="216" cy="270" r="6" fill="#A87528" />
    <circle cx="296" cy="270" r="6" fill="#A87528" />

    <!-- Golden Stash Crest / CS Emblem -->
    <circle cx="256" cy="354" r="15" fill="url(#goldGrad)" />
    <!-- Stylized CS Monogram on Crest -->
    <path d="M 251 350 C 248 351.5, 248 356.5, 252 358 C 257 360, 262 353, 260 349" 
          fill="none" 
          stroke="#2A2421" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Mortarboard Neck / Cap Collar -->
    <path d="M 174 210 L 174 245 C 174 278, 338 278, 338 245 L 338 210 Z" 
          fill="#D6C7B2" />

    <!-- Mortarboard Diamond Top (Campus Icon) -->
    <polygon points="256,108 402,176 256,244 110,176" 
             fill="url(#creamGrad)" 
             filter="url(#innerCapShadow)" />

    <!-- Top Cap Facet Shading (Subtle 3D angle) -->
    <polygon points="256,108 402,176 256,244 256,108" 
             fill="rgba(0,0,0,0.04)" />

    <!-- Mortarboard Center Button -->
    <ellipse cx="256" cy="176" rx="10" ry="7" fill="url(#goldGrad)" />

    <!-- Graduation Gold Tassel Cord -->
    <path d="M 256 176 Q 185 178, 142 206 T 132 268" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="7" 
          stroke-linecap="round" />

    <!-- Tassel Ring & Fringe -->
    <circle cx="132" cy="268" r="6" fill="#BA842E" />
    <path d="M 124 274 L 140 274 L 144 316 C 144 318, 141 320, 132 320 C 123 320, 120 318, 120 316 Z" 
          fill="url(#goldGrad)" />
  </g>
</svg>
