<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="hIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28766" />
      <stop offset="60%" stop-color="#C87A5B" />
      <stop offset="100%" stop-color="#A24F31" />
    </linearGradient>
    <linearGradient id="hGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4A6" />
      <stop offset="100%" stop-color="#D69B3D" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (64x64 at x=8, y=8) -->
  <g transform="translate(8, 8)">
    <rect width="64" height="64" rx="16" fill="url(#hIconGrad)" />
    <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    
    <!-- Mini Cap + Bag Fusion -->
    <!-- Bag -->
    <path d="M 22 32 L 24 51 C 24 53, 26 54, 28 54 L 36 54 C 38 54, 40 53, 40 51 L 42 32 Z" fill="#FFFFFF" />
    <path d="M 27 35 C 27 41, 37 41, 37 35" fill="none" stroke="#C87A5B" stroke-width="2" stroke-linecap="round" />
    <!-- Cap -->
    <polygon points="32,16 48,24 32,32 16,24" fill="#FFFFFF" />
    <ellipse cx="32" cy="24" rx="2" ry="1.5" fill="url(#hGold)" />
    <path d="M 32 24 Q 24 25, 19 28 T 17 36" fill="none" stroke="url(#hGold)" stroke-width="1.5" stroke-linecap="round" />
    <polygon points="16,36 18,36 19,42 15,42" fill="url(#hGold)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(84, 49)">
    <text font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="#2A2421">Campus<tspan fill="#C87A5B">Stash</tspan></text>
  </g>
</svg>
